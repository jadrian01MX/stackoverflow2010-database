name: Load Database Seed

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  import:
    name: Import BACPAC
    runs-on: ubuntu-latest

    env:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      DATA_STORAGE_ACCOUNT: ${{ vars.DATA_STORAGE_ACCOUNT }}
      DATA_CONTAINER: ${{ vars.DATA_CONTAINER }}
      DATA_BACPAC_BLOB: ${{ vars.DATA_BACPAC_BLOB }}
      SQL_SERVER: ${{ vars.SQL_SERVER }}
      SQL_DATABASE: ${{ vars.SQL_DATABASE }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate configuration
        run: |
          test -n "$DATA_STORAGE_ACCOUNT"
          test -n "$DATA_CONTAINER"
          test -n "$DATA_BACPAC_BLOB"
          test -n "$SQL_SERVER"
          test -n "$SQL_DATABASE"

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Verify Azure identity
        run: |
          az account show

          az account get-access-token \
            --resource https://storage.azure.com/ \
            --query "{subscription:subscription, tenant:tenant, expiresOn:expiresOn}" \
            --output table
      - name: Identify GitHub Actions service principal
        run: |
          PRINCIPAL_ID=$(az ad sp show \
            --id "$AZURE_CLIENT_ID" \
            --query id \
            --output tsv)

          DISPLAY_NAME=$(az ad sp show \
            --id "$AZURE_CLIENT_ID" \
            --query displayName \
            --output tsv)

          echo "Service principal: $DISPLAY_NAME"
          echo "Object ID: $PRINCIPAL_ID"
      - name: Install sqlcmd
        uses: azure/cli@v2
        with:
          inlineScript: |
            curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash
            sudo apt-get update
            sudo apt-get install -y mssql-tools18 unixodbc-dev
      - name: Test SQL authentication
        run: |
          sqlcmd \
            -S "tcp:${SQL_SERVER},1433" \
            -d master \
            -G \
            -Q "SELECT SUSER_SNAME(), DB_NAME();"

      - name: Download seed BACPAC
        run: |
          az storage blob download \
            --auth-mode login \
            --account-name "$DATA_STORAGE_ACCOUNT" \
            --container-name "$DATA_CONTAINER" \
            --name "$DATA_BACPAC_BLOB" \
            --file "$RUNNER_TEMP/StackOverflow2010.bacpac" \
            --no-progress

      - name: Install SqlPackage
        run: |
          wget -q https://aka.ms/sqlpackage-linux -O sqlpackage.zip
          unzip -q sqlpackage.zip -d sqlpackage
          chmod +x sqlpackage/sqlpackage

      - name: Import BACPAC
        run: |
          ./sqlpackage/sqlpackage \
            /Action:Import \
            /SourceFile:"$RUNNER_TEMP/StackOverflow2010.bacpac" \
            /TargetConnectionString:"Server=tcp:${SQL_SERVER},1433;Initial Catalog=${SQL_DATABASE};Authentication=Active Directory Default;Encrypt=True;TrustServerCertificate=False;Connection Timeout=60;"